name: Live Testing Environment

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: true
        default: 'e2e'
        type: choice
        options:
        - e2e
        - integration
        - performance

jobs:
  setup-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions/github-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./staging-site
        destination_dir: staging
    
    - name: Setup Test Environment
      run: |
        echo "🚀 Staging environment deployed successfully"
        echo "🌐 URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/staging"

  run-e2e-tests:
    needs: setup-staging
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'e2e'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install Playwright
      run: |
        npm install -g @playwright/test
    
    - name: Install dependencies
      run: |
        cd chrome-extension && npm ci
    
    - name: Build extension
      run: |
        cd chrome-extension && npm run build
    
    - name: Run E2E Tests
      run: |
        npx playwright test --project=e2e --reporter=html
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: e2e-test-results
        path: |
          chrome-extension/playwright-report/
          test-results/
    
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const path = './chrome-extension/playwright-report/index.html';
          if (fs.existsSync(path)) {
            const report = fs.readFileSync(path, 'utf8');
            const comment = `
            ## 🧪 E2E Test Results
            
            ### Test Environment: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/staging
            
            ${report}
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
          }

  run-integration-tests:
    needs: setup-staging
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'integration'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Run Integration Tests
      run: |
        cd chrome-extension && npm run test:integration
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      with:
        name: integration-test-results
        path: chrome-extension/test-results/

  performance-tests:
    needs: setup-staging
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'performance'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Run Performance Tests
      run: |
        cd chrome-extension && npm run test:performance
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-test-results
        path: chrome-extension/performance-results/
